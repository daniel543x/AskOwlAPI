services:
  api:
    build: .
    profiles: ["api"]
    ports:
      - "3000:3000"
    environment:
      POSTGRES_SERVER: db
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_PORT: 5432
      MASTER_KEY: ${MASTER_KEY:?MASTER_KEY must be set in .env}
      SEARXNG_BASE_URL: http://searXNG:8080
      OLLAMA_BASE_URL: http://ollama:11434
    depends_on:
      - db
      - searXNG
    networks:
      - AskOwl-Net

  db:
    # pgvector image: ships the `vector` extension required by the chunk store.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - AskOwl-Net

  searXNG:
    image: searxng/searxng:latest
    environment:
      - SEARXNG_BASE_URL=http://localhost:8080/
      - SEARXNG_SECRET=${SEARXNG_SECRET:?SEARXNG_SECRET must be set in .env}
    ports:
      - 8080:8080
    volumes:
      - ./data/searxng/settings.yml:/etc/searxng/settings.yml:Z
    networks:
      - AskOwl-Net

  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - AskOwl-Net

networks:
  AskOwl-Net:
    external: false

volumes:
  postgres_data:
  ollama_data:
