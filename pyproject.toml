[project]
name = "askowlapi"
version = "1.0.0rc1"
description = "AskOwl backend API."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    "cryptography>=46.0.3",
    "fastapi>=0.121.3",
    "flashrank>=0.2.10",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "langchain>=1.2.10",
    "langchain-anthropic>=1.3.4",
    "langchain-google-vertexai>=3.2.2",
    "langchain-ollama>=1.0.1",
    "langchain-openai>=1.1.10",
    "langchain-text-splitters>=1.1.1",
    "passlib[bcrypt]>=1.7.4",
    "pgvector>=0.5.1",
    "pydantic-settings>=2.12.0",
    "pydantic[email]>=2.12.4",
    "pyjwt>=2.15.1",
    "python-multipart>=0.0.20",
    "sqlalchemy[asyncio]>=2.1.5",
    "sqlmodel>=0.0.27",
    "trafilatura>=2.0.0",
    "uvicorn[standard]>=0.38.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.1",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "python-lsp-server>=1.15.0",
    "ruff>=0.14.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-m 'not integration'"
markers = [
    "integration: tests that need a live Postgres database (deselected by default; run with: pytest -m integration)",
]

[tool.basedpyright]
include = ["src", "tests"]
# Alembic revisions are autogenerated; they are not type-checked.
exclude = ["migrations", "**/__pycache__"]
typeCheckingMode = "standard"

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency injection is the intended use of calls in argument defaults.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Body"]
